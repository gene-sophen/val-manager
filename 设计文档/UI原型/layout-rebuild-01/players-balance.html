<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7fafc"><title>L1 · 选手页</title><link rel="stylesheet" href="../art-direction-03/cards.css"><link rel="stylesheet" href="home-balance.css"><link rel="stylesheet" href="players-balance.css"></head><body>
<main class="balance-review"><header class="balance-heading"><div><span>布局确认 / 02 选手</span><h1>尺寸统一，特性融入卡面。</h1><p>保留人物比例，将特性与特工组合在同一区域。</p></div><a href="home-balance.html">已确认首页 ↗</a></header>
<div class="balance-stage"><section class="balance-phone players-phone" aria-label="新版选手页"><header class="balance-top"><h2>选手 <span id="player-count" aria-live="polite">5</span></h2><span class="club-mark">VM</span></header><div class="balance-scroll" id="players-scroll">
<form class="players-tools" role="search" id="players-search-form"><label class="players-search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-5-5 M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13"/></svg><input id="player-query" type="search" placeholder="搜索选手" aria-label="搜索姓名、队伍或特工" autocomplete="off"></label><label class="players-sort"><span class="sr-only">排序方式</span><select id="player-sort"><option value="default">默认排序</option><option value="rating">总评 ↓</option><option value="AIM">枪法 ↓</option><option value="SYN">协同 ↓</option><option value="SEN">意识 ↓</option></select></label></form>
<div class="players-grid" id="players-grid" aria-label="选手卡片"></div><section class="players-empty" id="players-empty" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-5-5 M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13"/></svg><h3>没有匹配的选手</h3><button id="clear-search">清除搜索</button></section>
</div><nav class="balance-nav" aria-label="主导航"><a href="home-balance.html"><svg viewBox="0 0 24 24"><path d="M4 10 12 4l8 6v10H4Z M9 20v-7h6v7"/></svg>俱乐部</a><a aria-current="page" href="players-balance.html"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M17 4a4 4 0 0 1 0 7 M22 21v-2a4 4 0 0 0-3-3.87"/></svg>选手</a><a href="../art-direction-03/mobile.html#album"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5Z M8 7h8 M8 11h8 M8 15h4"/></svg>卡册</a></nav></section>
<aside class="balance-notes trait-review"><span class="note-kicker">选手卡 / 位置修正</span><h2>外框统一，<br>内部有区别。</h2><p class="trait-review-copy">金卡特性移到特工头像旁，三维回到底部统一位置。铜银卡保持清爽；钻卡用赛事图、招牌特工和明星时刻表达区别。</p><div class="preview-switch" role="group" aria-label="卡型预览"><button data-preview="standard" aria-pressed="true">标准名单</button><button data-preview="diamond" aria-pressed="false">含钻卡样例</button></div><div class="review-hint">切换仅替换第一张展示样例，便于比较同尺寸卡片。<br>钻卡通用特性在放大卡面中查看。</div><a class="source-link" href="../../选手卡/卡面原型.html">参考原有卡面 ↗</a></aside></div></main>
<dialog class="balance-dialog" id="player-dialog"><header><strong>选手卡</strong><button id="close-player" aria-label="关闭选手卡">×</button></header><div id="player-detail"></div></dialog>
