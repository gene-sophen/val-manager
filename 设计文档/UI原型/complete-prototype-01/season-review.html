<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAL MANAGER · 页面总览</title><link rel="stylesheet" href="../art-direction-03/cards.css"><link rel="stylesheet" href="ui.css"><style>body{background:#f2f7fa;color:#37566e}main{max-width:1350px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:25px;margin:0 0 10px}header p{font-size:12px;line-height:1.9;color:#7f99ac}header a{font-size:12px;white-space:nowrap;color:#398fb9;min-height:44px;display:flex;align-items:center}.filters{display:flex;gap:10px;margin:24px 0}.filters button{min-height:44px;padding:10px 20px;border:1px solid #d3e5ef;border-radius:12px;background:#fff;color:#7999af;font-size:12px}.filters [aria-pressed=true]{background:#ecf8fe;border-color:#aad6ea;color:#2798c9;box-shadow:0 3px 0 #beddeb}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px 20px}article{min-width:0}article a{display:block}article img{width:100%;height:auto;display:block;border-radius:18px;border:1px solid #dce7ee;box-shadow:0 4px 0 #dbe7f0}article h2{font-size:12px;margin:14px 3px;color:#587d97}article h2 span{font-size:10px;color:#9ab5c6;margin-right:10px}@media(max-width:480px){main{padding:24px 14px}header{display:block}h1{font-size:21px}#gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}article img{border-radius:12px}.filters{gap:6px}.filters button{padding:8px 13px}}</style></head><body><main><header><div><h1>征战试玩 · 页面总览</h1><p>35 个最新版页面与两个真实签表 BO5 决赛预览。点击进入独立预览，不覆盖你的征战。整体体验的新征战已接入赛果与晋级；普通章节为界面样例，精确空间回放待接入。</p></div><a href="index.html">进入整体体验 →</a></header><nav class="filters" aria-label="页面分区"><button data-group="all" aria-pressed="true">全部</button><button data-group="campaign" aria-pressed="false">征战</button><button data-group="team" aria-pressed="false">战队</button><button data-group="archive" aria-pressed="false">档案</button></nav><div id="gallery"></div></main><script>let catalog=[];const gallery=document.getElementById('gallery');function render(group='all'){gallery.replaceChildren();catalog.filter(p=>group==='all'||p.group===group).forEach((p,i)=>{const article=document.createElement('article'),link=document.createElement('a'),img=document.createElement('img'),title=document.createElement('h2');link.href=p.scene?'index.html?scene='+encodeURIComponent(p.scene):'index.html?scene=active&preview='+encodeURIComponent(p.route);img.src=p.image;img.alt=p.title;img.loading='lazy';title.textContent=String(i+1).padStart(2,'0')+' · '+p.title;link.append(img,title);article.append(link);gallery.append(article);});}fetch('preview/season-catalog.json').then(r=>r.json()).then(data=>{catalog=data;render();});document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-group]').forEach(x=>x.setAttribute('aria-pressed',x===b));render(b.dataset.group);}));</script></body></html>
