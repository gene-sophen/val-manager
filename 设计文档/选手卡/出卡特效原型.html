<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出卡特效原型 v2</title>
<style>
  @font-face{font-family:'Anton';font-weight:400;font-display:swap;
    src:url('../../素材库/字体/Anton-400.woff2') format('woff2')}
  @font-face{font-family:'Rajdhani';font-weight:700;font-display:swap;
    src:url('../../素材库/字体/Rajdhani-700.woff2') format('woff2')}
</style>
<style>
  :root{
    --bg:#0F1923; --ink:#F5F2EC; --dim:#AAB9C6; --red:#FF4655;
    --copper:#B08968; --silver:#C9D4DE; --gold:#E8B93E; --dia:#A9F1FF;
    --mini-hex:polygon(50% 1%,97% 12%,97% 88%,50% 99%,3% 88%,3% 12%);
    --tex-copper:url('../../素材库/底纹/铜.png');
    --tex-silver:url('../../素材库/底纹/银.png');
    --tex-gold:url('../../素材库/底纹/金.png');
    --tex-dia:url('../../素材库/底纹/钻.png');
    --tex-holo:url('../../素材库/底纹/全息.png');
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Rajdhani','Microsoft YaHei',sans-serif;
    height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none}
  body::before{content:'';position:fixed;top:-20%;right:-10%;width:60%;height:140%;pointer-events:none;
    background:linear-gradient(105deg,transparent 46%,rgba(255,70,85,.06) 46%,rgba(255,70,85,.06) 54%,transparent 54%)}

  /* ===== 顶栏 ===== */
  .bar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;gap:10px;
    padding:12px 18px;background:linear-gradient(180deg,rgba(10,16,21,.95),rgba(10,16,21,.75) 80%,transparent)}
  .bar h1{font-family:'Anton',sans-serif;font-size:18px;letter-spacing:2px;margin-right:10px}
  .bar h1 span{color:var(--red)}
  .bar button{background:#16202a;border:1px solid #2a3742;color:var(--ink);border-radius:6px;
    padding:6px 14px;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:inherit}
  .bar button:hover{background:#1d2a36;border-color:#3d4f5e}
  .bar .sep{width:1px;height:20px;background:#2a3742}
  .bar .rb{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .hint{margin-left:auto;color:var(--dim);font-size:12px;letter-spacing:1px}

  /* ===== 场景 ===== */
  .scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1400px}
  .scene.shake{animation:shk .44s cubic-bezier(.2,.7,.3,1)}
  @keyframes shk{
    0%{transform:none}
    10%{transform:translate(-11px,7px) rotate(-1.1deg)}
    22%{transform:translate(9px,-8px) rotate(.9deg)}
    36%{transform:translate(-8px,-6px) rotate(.6deg)}
    50%{transform:translate(6px,5px) rotate(-.5deg)}
    66%{transform:translate(-4px,3px) rotate(.25deg)}
    82%{transform:translate(2px,-2px)}
    100%{transform:none}}
  /* 钻卡揭示瞬间的卡体顿挫（打击感） */
  .mini.jolt{animation:jolt .34s cubic-bezier(.16,.9,.3,1)}
  @keyframes jolt{0%{scale:1.13}28%{scale:1.26}55%{scale:1.09}100%{scale:1.13}}

  /* ===== 卡包 ===== */
  .pack{width:210px;height:300px;cursor:pointer;position:relative;z-index:5;
    clip-path:polygon(50% 0,100% 13%,100% 87%,50% 100%,0 87%,0 13%);
    background:linear-gradient(165deg,#232f3c,#121a23 55%,#0b1015);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    animation:floaty 3.2s ease-in-out infinite;
    filter:drop-shadow(0 14px 30px rgba(0,0,0,.65)) drop-shadow(0 0 18px rgba(255,70,85,.22))}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .pack::before{content:'';position:absolute;inset:5px;clip-path:polygon(50% 0,100% 13%,100% 87%,50% 100%,0 87%,0 13%);
    background:linear-gradient(165deg,rgba(255,70,85,.14),transparent 40%,rgba(255,70,85,.08))}
  .pack .v{font-family:'Anton',sans-serif;font-size:64px;color:var(--red);text-shadow:0 0 24px rgba(255,70,85,.6)}
  .pack .pt{font-size:14px;font-weight:700;letter-spacing:6px;color:var(--dim)}
  .pack .pr{font-size:11px;letter-spacing:2px;color:#5c6b78}
  .pack.open{animation:pop .45s ease forwards}
  @keyframes pop{40%{transform:scale(1.18);opacity:1}100%{transform:scale(1.5);opacity:0}}

  /* ===== 牌阵 ===== */
  .board{display:none;flex-direction:column;gap:18px;align-items:center;z-index:5}
  .board.on{display:flex}
  .brow{display:flex;gap:18px}
  .slot{width:150px;height:235px;position:relative}

  /* ===== 迷你卡（示意卡面，正式版复用定稿卡面） ===== */
  .mini{position:absolute;inset:0;cursor:pointer;transition:filter .3s}
  .mini-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
  .mini.rev{cursor:default}
  .mini.rev .mini-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face.front{transform:rotateY(180deg)}
  .cback{position:absolute;inset:0;clip-path:var(--mini-hex);
    background:linear-gradient(165deg,#28343f,#141c25 55%,#0c1218);
    display:flex;align-items:center;justify-content:center}
  .cback::before{content:'';position:absolute;inset:5px;clip-path:var(--mini-hex);
    background:repeating-linear-gradient(125deg,rgba(236,232,225,.05) 0 2px,transparent 2px 12px)}
  .cback b{font-family:'Anton',sans-serif;font-size:42px;color:rgba(255,70,85,.85);text-shadow:0 0 16px rgba(255,70,85,.45)}
  .cface{position:absolute;inset:0;clip-path:var(--mini-hex);background-size:cover;background-position:center}
  .cface.r-铜{background-image:var(--tex-copper)}
  .cface.r-银{background-image:var(--tex-silver)}
  .cface.r-金{background-image:var(--tex-gold)}
  .cface.r-钻{background-image:var(--tex-dia)}
  .cin{position:absolute;inset:5px;clip-path:var(--mini-hex);overflow:hidden;
    background:linear-gradient(168deg,#18222d,#10161d 55%,#0a0f14);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:34px}
  .crt{position:absolute;top:16px;left:16px;font-family:'Anton',sans-serif;font-size:30px;line-height:1;
    text-shadow:0 2px 5px rgba(0,0,0,.9)}
  .r-铜 .crt{color:#D8B794}.r-银 .crt{color:#EAF1F7}.r-金 .crt{color:#F7DC85}.r-钻 .crt{color:#C9F4FF}
  .cid{font-family:'Anton',sans-serif;font-size:15px;letter-spacing:1px;text-align:center;line-height:1.15;
    text-shadow:0 2px 5px rgba(0,0,0,.9);padding:0 8px}
  .crl{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--dim);margin-top:4px}
  /* 驻留光晕 */
  .mini.glow-铜{filter:drop-shadow(0 0 6px rgba(176,137,104,.4))}
  .mini.glow-银{filter:drop-shadow(0 0 10px rgba(201,212,222,.55))}
  .mini.glow-金{filter:drop-shadow(0 0 16px rgba(232,185,62,.8))}
  .mini.glow-钻{filter:drop-shadow(0 0 20px rgba(169,241,255,.85))}
  /* 蓄力充能（原地光晕渐亮，无位移） */
  .mini.charge-金{filter:drop-shadow(0 0 26px rgba(232,185,62,1))}
  .mini.charge-钻{filter:drop-shadow(0 0 30px rgba(169,241,255,1)) drop-shadow(0 0 46px rgba(185,157,241,.7))}
  /* 扫光 */
  .shine{position:absolute;inset:0;z-index:6;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);
    background-size:260% 100%;animation:sweep .7s ease forwards}
  @keyframes sweep{from{background-position:130% 0}to{background-position:-30% 0}}
  /* 钻卡全息驻留 */
  .holo{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
    background-image:var(--tex-holo);background-size:cover;mix-blend-mode:screen;
    animation:holoin 1.2s ease .2s forwards}
  @keyframes holoin{to{opacity:.35}}

  /* ===== 屏幕级 ===== */
  .dim{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .4s;pointer-events:none;z-index:40}
  .dim.on{opacity:.74}
  /* 慢速余晖射线（翻转落定后驻留片刻） */
  .rays{position:fixed;left:50%;top:50%;width:300px;height:300px;z-index:41;opacity:0;border-radius:50%;
    pointer-events:none;transform:translate(-50%,-50%);transition:opacity .3s;filter:blur(2.5px);
    -webkit-mask:radial-gradient(circle,#000 0 48%,transparent 68%);mask:radial-gradient(circle,#000 0 48%,transparent 68%)}
  .rays.on{opacity:.28;animation:spin 6s linear infinite}
  .rays.gold{background:repeating-conic-gradient(transparent 0deg,rgba(255,205,80,.16) 2.2deg,transparent 4.5deg,transparent 22deg)}
  .rays.prism{background:repeating-conic-gradient(transparent 0deg,rgba(169,241,255,.14) 1.8deg,rgba(185,157,241,.11) 3.4deg,transparent 6deg,transparent 20deg)}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  /* ===== 爆闪组件（分层） ===== */
  /* 1. 白炽核心 */
  .core{position:fixed;z-index:44;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
    transform:translate(-50%,-50%);animation:coreA .5s ease-out forwards}
  @keyframes coreA{0%{opacity:.85;scale:.25}55%{opacity:.7}100%{opacity:0;scale:1.6}}
  /* 2. 六边形冲击波环 */
  .hexring{position:fixed;z-index:43;pointer-events:none;width:190px;height:190px;
    transform:translate(-50%,-50%) scale(.18);opacity:.7;
    animation:ringGrow var(--d,.6s) cubic-bezier(.15,.6,.3,1) var(--dl,0s) forwards}
  .hexring svg{width:100%;height:100%;display:block}
  @keyframes ringGrow{to{transform:translate(-50%,-50%) scale(var(--s,1.8));opacity:0}}
  /* 3. 光刃（外层定位+旋转，内层伸缩，两端渐变消隐） */
  .streak{position:fixed;z-index:43;pointer-events:none;width:2px;height:2px}
  .streak i{display:block;width:var(--len,280px);height:3px;border-radius:2px;
    transform:translate(-50%,-50%);transform-origin:center;filter:blur(.6px);opacity:.8;
    background:linear-gradient(90deg,transparent 6%,var(--c,#fff) 40%,#fff 50%,var(--c,#fff) 60%,transparent 94%);
    animation:streakA .48s ease-out forwards}
  @keyframes streakA{0%{opacity:0;scale:.05 .8}22%{opacity:.8}100%{opacity:0;scale:1.25 .5}}
  /* 4. 瞬时星芒（软边渐变） */
  .spokes{position:fixed;z-index:43;pointer-events:none;border-radius:50%;
    transform:translate(-50%,-50%);mix-blend-mode:screen;filter:blur(1.2px);
    -webkit-mask:radial-gradient(circle,#000 0 34%,transparent 60%);mask:radial-gradient(circle,#000 0 34%,transparent 60%);
    animation:spokesA .42s ease-out forwards}
  @keyframes spokesA{0%{opacity:.75;scale:.2}100%{opacity:0;scale:1.1}}
  /* 5. 双层粒子：外散后渐变消失（无下坠） */
  .pt{position:fixed;z-index:44;pointer-events:none;border-radius:1px;opacity:1;
    animation:fly var(--t,.85s) cubic-bezier(.15,.6,.35,1) var(--dl,0s) forwards}
  @keyframes fly{
    0%{transform:translate(0,0) rotate(0);opacity:.95}
    55%{opacity:.55}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(180deg)}}

  /* ===== 逐张揭示台 ===== */
  #stage{position:relative;width:170px;height:267px;z-index:5}
  #stage .mini{scale:1.13}
  .prog{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:55;
    font-size:14px;font-weight:700;letter-spacing:4px;color:var(--dim)}

  /* ===== 单卡演示 ===== */
  .solo{display:none;position:relative;width:170px;height:267px;z-index:5}
  .solo.on{display:block}
  .solo .mini{scale:1.13}
</style>
</head>
<body>

<div class="bar">
  <h1>出卡特效原型 <span>V2.4</span></h1>
  <button id="btnPack">开新包（10连）</button>
  <button id="btnAll">全部翻开</button>
  <div class="sep"></div>
  <button data-r="铜"><i class="rb" style="background:#B08968"></i>铜</button>
  <button data-r="银"><i class="rb" style="background:#C9D4DE"></i>银</button>
  <button data-r="金"><i class="rb" style="background:#E8B93E"></i>金</button>
  <button data-r="钻"><i class="rb" style="background:#A9F1FF"></i>钻</button>
  <span class="hint">v2.2：整包逐张揭示（点击翻开→自动流转下一张）· 光束柔化 · 特效范围收敛</span>
</div>

<div class="prog" id="prog"></div>
<div class="dim" id="dim"></div>
<div class="rays" id="rays"></div>

<div class="scene" id="scene">
  <div class="pack" id="pack">
    <div class="v">V</div>
    <div class="pt">赛区卡包</div>
    <div class="pr">点击开启 · 10 张</div>
  </div>
  <div id="stage"></div>
  <div class="board" id="board"></div>
  <div class="solo" id="solo"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const q = new URLSearchParams(location.search);
const AUTO = q.has('auto');
const POOL = {
  '铜': [['Haodong', 47], ['S1Mon', 52], ['LuoK1ng', 55], ['YHchen', 50], ['Flex1n', 49]],
  '银': [['Knight', 74], ['whzy', 76], ['BerLIN', 71], ['Abo', 70], ['Stew', 73]],
  '金': [['ZmjjKK', 83], ['CHICHOO', 81], ['nobody', 80]],
  '钻': [['ZmjjKK · 东京', 90]]
};
const PCOL = {
  '铜': ['#8a8f96', '#B08968'],
  '银': ['#C9D4DE', '#ffffff'],
  '金': ['#E8B93E', '#fff3c2', '#ff9d3c'],
  '钻': ['#A9F1FF', '#b99df1', '#ffffff', '#7ef0c8']
};
let busy = false;

/* ---------- 基础件 ---------- */
function spawnP(x, y, colors, n, opt = {}) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'pt';
    const a = Math.random() * Math.PI * 2;
    const fast = i % 2 === 0;
    const d = fast ? 66 + Math.random() * 100 : 30 + Math.random() * 52;
    const s = fast ? 3 + Math.random() * 3.5 : 4.5 + Math.random() * 4;
    const c = colors[i % colors.length];
    p.style.cssText = `left:${x}px;top:${y}px;background:${c};width:${s}px;height:${s}px;` +
      `--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - (opt.lift || 24)}px;` +
      `--t:${fast ? .55 + Math.random() * .3 : .85 + Math.random() * .35}s;` +
      `--dl:${(opt.delay || 0) + Math.random() * .08}s;box-shadow:0 0 6px ${c}`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1600);
  }
}
function core(x, y, size, color) {
  const f = document.createElement('div');
  f.className = 'core';
  f.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;` +
    `background:radial-gradient(circle,#fff 0 14%,${color} 32%,transparent 64%)`;
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 560);
}
function hexRing(x, y, color, scale, dur, delay) {
  const r = document.createElement('div');
  r.className = 'hexring';
  r.style.cssText = `left:${x}px;top:${y}px;--s:${scale};--d:${dur}s;--dl:${delay}s`;
  r.innerHTML = `<svg viewBox="0 0 150 235"><polygon points="75,2 146,30 146,205 75,233 4,205 4,30"
    fill="none" stroke="${color}" stroke-width="${delay > 0 ? 1.6 : 2.4}"/></svg>`;
  document.body.appendChild(r);
  setTimeout(() => r.remove(), (dur + delay) * 1000 + 100);
}
function streak(x, y, angle, len, color, wide) {
  const w = document.createElement('div');
  w.className = 'streak';
  w.style.cssText = `left:${x}px;top:${y}px;transform:rotate(${angle}deg)`;
  const i = document.createElement('i');
  i.style.cssText = `--len:${len}px;--c:${color};${wide ? 'height:5px' : ''}`;
  w.appendChild(i);
  document.body.appendChild(w);
  setTimeout(() => w.remove(), 600);
}
function spokes(x, y, size, color) {
  const s = document.createElement('div');
  s.className = 'spokes';
  s.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;` +
    `background:repeating-conic-gradient(transparent 0deg,${color} 1.2deg,transparent 2.6deg,transparent 28deg)`;
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 520);
}
/* 分层爆闪：核心 + 双六边环 + 光刃×4 + 星芒 + 双层粒子 */
function burst(x, y, cfg) {
  core(x, y, cfg.core, cfg.main);
  spokes(x, y, cfg.core * 1.15, cfg.spoke);
  hexRing(x, y, cfg.main, cfg.ring[0], .62, 0);
  hexRing(x, y, cfg.main, cfg.ring[1], .78, .09);
  streak(x, y, 0, cfg.len, cfg.main, true);
  streak(x, y, 60, cfg.len * .8, cfg.main);
  streak(x, y, -60, cfg.len * .8, cfg.main);
  streak(x, y, 90, cfg.len * .55, cfg.main);
  spawnP(x, y, cfg.pcols, cfg.n, {lift: cfg.lift});
}
const BURST = {
  '金': {core: 280, main: 'rgba(255,214,110,.75)', spoke: 'rgba(255,225,140,.35)',
    ring: [1.25, 1.7], len: 230, pcols: PCOL['金'], n: 16, lift: 28},
  '钻': {core: 380, main: 'rgba(200,245,255,.75)', spoke: 'rgba(185,157,241,.32)',
    ring: [1.4, 1.9], len: 270, pcols: PCOL['钻'], n: 24, lift: 34}
};
function showRays(type, dur, x, y) {
  const r = $('#rays');
  r.style.left = x + 'px'; r.style.top = y + 'px';
  r.className = 'rays on ' + type;
  setTimeout(() => { r.className = 'rays'; }, dur);
}
function shake() {
  const s = $('#scene');
  s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
}
function shine(mini) {
  const c = mini.querySelector('.cin');
  if (!c) return;
  const sh = document.createElement('div');
  sh.className = 'shine';
  c.appendChild(sh);
  setTimeout(() => sh.remove(), 750);
}
function centerOf(el) {
  const r = el.getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height / 2];
}
/* 蓄力回旋 → 过冲翻转。windup: 反向角度, dur: 翻转时长, edgeAt: 刃面朝观众的时机 */
async function flipCard(mini, r, windup, windT, dur, edgeAt) {
  const inner = mini.querySelector('.mini-inner');
  inner.style.transitionDuration = windT + 's';
  inner.style.transitionTimingFunction = 'ease-in';
  inner.style.transform = `rotateY(${windup}deg)`;
  await sleep(windT * 1000);
  inner.style.transitionDuration = dur + 's';
  inner.style.transitionTimingFunction = 'cubic-bezier(.2,.85,.3,1.12)';
  inner.style.transform = '';
  mini.classList.add('rev');
  await sleep(edgeAt * 1000);
}

/* ---------- 翻牌（反转为主语言，无位移） ---------- */
async function reveal(mini, fast) {
  if (mini.classList.contains('rev')) return;
  const r = mini.dataset.r;
  const inner = mini.querySelector('.mini-inner');
  if (fast) { mini.classList.add('rev', 'glow-' + r); return; }
  const [cx, cy] = centerOf(mini);
  if (r === '铜') {
    inner.style.transitionDuration = '.38s';
    mini.classList.add('rev');
    spawnP(cx, cy, PCOL[r], 5);
    mini.classList.add('glow-铜');
  } else if (r === '银') {
    inner.style.transitionDuration = '.5s';
    mini.classList.add('rev');
    await sleep(230);
    core(cx, cy, 200, 'rgba(235,242,248,.8)');
    spawnP(cx, cy, PCOL[r], 8);
    mini.classList.add('glow-银');
    await sleep(300);
    shine(mini);
  } else if (r === '金') {
    mini.classList.add('charge-金');                 // 原地充能
    await flipCard(mini, r, -14, .26, .72, .39);     // 回旋蓄力 → 过冲翻转 → 刃面时机
    burst(cx, cy, BURST['金']);                      // 分层爆闪
    showRays('gold', 1700, cx, cy);                  // 金色余晖
    await sleep(500);
    mini.classList.remove('charge-金');
    mini.classList.add('glow-金');
  } else if (r === '钻') {
    $('#dim').classList.add('on');                   // 屏幕压暗（钻独占）
    mini.classList.add('charge-钻');
    // 震动提前：与爆闪同步爆发（在刃面时机前 0.15s 起手）
    setTimeout(() => {
      shake();
      mini.classList.add('jolt');
      setTimeout(() => mini.classList.remove('jolt'), 380);
    }, (.3 + .55 - .15) * 1000);
    await flipCard(mini, r, -18, .3, 1.0, .55);      // 更深的回旋 → 更慢的过冲翻转
    burst(cx, cy, BURST['钻']);                      // 加强版分层爆闪
    showRays('prism', 2700, cx, cy);
    mini.querySelector('.cin').insertAdjacentHTML('beforeend', '<div class="holo"></div>');
    await sleep(700);
    $('#dim').classList.remove('on');
    mini.classList.remove('charge-钻');
    mini.classList.add('glow-钻');
  }
}

/* ---------- 整包：逐张揭示 ---------- */
function rollRarity() {
  const x = Math.random();
  return x < .08 ? '钻' : x < .26 ? '金' : x < .58 ? '银' : '铜';
}
function cardHTML(r, id, rt, foot) {
  return `<div class="mini" data-r="${r}"><div class="mini-inner">` +
    `<div class="face back"><div class="cback"><b>V</b></div></div>` +
    `<div class="face front"><div class="cface r-${r}"><div class="cin">` +
    `<div class="crt">${rt}</div><div class="cid">${id}</div><div class="crl">${foot}</div>` +
    `</div></div></div></div></div>`;
}
let queue = [], qpos = 0;

function rollQueue() {
  const cards = [];
  for (let i = 0; i < 10; i++) cards.push(rollRarity());
  if (!cards.includes('金') && !cards.includes('钻')) cards[Math.floor(Math.random() * 10)] = '金';
  return cards.map(r => {
    const [id, rt] = POOL[r][Math.floor(Math.random() * POOL[r].length)];
    return {r, id, rt};
  });
}

function showStep() {
  const stage = $('#stage');
  const c = queue[qpos];
  stage.innerHTML = cardHTML(c.r, c.id, c.rt, '点击翻开');
  const m = stage.querySelector('.mini');
  m.style.transition = 'none';
  m.style.transform = 'scale(.4) rotateY(84deg)';
  m.style.opacity = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    m.style.transition = 'transform .45s cubic-bezier(.2,.8,.3,1.1), opacity .3s';
    m.style.transform = '';
    m.style.opacity = '1';
    setTimeout(() => { m.style.transition = ''; }, 500);
  }));
  $('#prog').textContent = `${qpos + 1} / ${queue.length}`;
  m.addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    if (!m.classList.contains('rev')) {
      await reveal(m);
      const crl = m.querySelector('.crl');
      if (crl && $('#stage').contains(m)) crl.textContent = '点击继续';
    } else {
      await nextStep(m);
    }
    busy = false;
  });
}

async function nextStep(m) {
  m.style.transition = 'transform .35s ease-in, opacity .3s';
  m.style.transform = 'scale(.4) rotateY(84deg)';
  m.style.opacity = '0';
  await sleep(340);
  qpos++;
  if (qpos < queue.length) showStep();
  else { $('#stage').innerHTML = ''; $('#prog').textContent = ''; showSummary(); }
}

/* 全部揭示后的结算牌阵 */
function showSummary() {
  const board = $('#board');
  board.innerHTML = '';
  const rows = [document.createElement('div'), document.createElement('div')];
  rows.forEach(r => r.className = 'brow');
  queue.forEach((c, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.innerHTML = cardHTML(c.r, c.id, c.rt, '枪法 -- · 协同 -- · 意识 --');
    const m = slot.querySelector('.mini');
    m.classList.add('rev', 'glow-' + c.r);
    rows[i < 5 ? 0 : 1].appendChild(slot);
  });
  rows.forEach(r => board.appendChild(r));
  board.classList.add('on');
}

$('#btnPack').onclick = () => {
  $('#solo').classList.remove('on');
  $('#board').classList.remove('on');
  $('#stage').innerHTML = '';
  $('#prog').textContent = '';
  const p = $('#pack');
  p.style.display = '';
  p.classList.remove('open');
  p.onclick = async () => {
    p.classList.add('open');
    spawnP(...centerOf(p), ['#FF4655', '#8a97a3', '#fff'], 18);
    await sleep(420);
    p.style.display = 'none';
    queue = rollQueue();
    qpos = 0;
    showStep();
  };
};

$('#btnAll').onclick = async () => {
  if (busy || !queue.length) return;
  busy = true;
  while (qpos < queue.length) {
    const m = $('#stage .mini');
    if (!m) break;
    if (!m.classList.contains('rev')) {
      if (m.dataset.r === '铜' || m.dataset.r === '银')
        m.querySelector('.mini-inner').style.transitionDuration = '.3s';
      await reveal(m);
    }
    await sleep(m.dataset.r === '金' || m.dataset.r === '钻' ? 450 : 170);
    await nextStep(m);
  }
  busy = false;
};

/* ---------- 单卡演示 ---------- */
document.querySelectorAll('.bar [data-r]').forEach(btn => {
  btn.onclick = () => {
    $('#board').classList.remove('on');
    $('#stage').innerHTML = '';
    $('#prog').textContent = '';
    $('#pack').style.display = 'none';
    const r = btn.dataset.r;
    const [id, rt] = POOL[r][0];
    const solo = $('#solo');
    solo.innerHTML = cardHTML(r, id, rt, `点击翻开 · ${r}卡特效`);
    solo.classList.add('on');
    const m = solo.querySelector('.mini');
    m.addEventListener('click', async () => {
      if (busy) return;
      busy = true;
      await reveal(m);
      busy = false;
    });
  };
});

/* ---------- 自动演示（截图验证用） ---------- */
if (AUTO) {
  $('#pack').style.display = 'none';
  queue = rollQueue();
  qpos = queue.length;
  showSummary();
}
</script>
