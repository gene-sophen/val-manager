name: Publish mobile PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the shared spatial engine
        run: node 游戏/tools/build-spatial.cjs
      - name: Check organized source and shared resources
        run: node scripts/check-project-layout.cjs
      - name: Check release and PWA contracts
        run: node --test 游戏/tests/team-power.test.js 游戏/tests/season-simulation.test.js 游戏/tests/aurora-views.test.js 游戏/tests/match-ui-state.test.js 游戏/tests/match-controls.test.js 游戏/tests/player-journeys.test.js 游戏/tests/player-experience.test.js 游戏/tests/round-worker.test.js 游戏/tests/frontend-navigation.test.js 游戏/tests/campaign-spatial-policy.test.js 游戏/tests/spatial-career-store.test.js 游戏/tests/playback-preference.test.js 游戏/tests/release-assets.test.js 游戏/tests/mobile-images.test.js 游戏/tests/round-presentation.test.js 游戏/tests/pwa-update.test.js
      - name: Build and validate static release
        run: node 游戏/tools/build-pages.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .artifacts/releases/current
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
